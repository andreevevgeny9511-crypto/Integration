# ============================================================
# Bitrix24 ↔ Listok Integration — Nginx Monitoring Config
# ============================================================

# Nginx status page (for monitoring)
server {
    listen 8080;
    server_name _;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.18.0.0/16;  # Docker network range
        deny all;
    }
}

# Prometheus exporter for Nginx (requires nginx-module-vts or stub_status)
# This is a basic stub_status endpoint that Prometheus can scrape
