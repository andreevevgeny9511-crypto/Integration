# ============================================================
# Bitrix24 ↔ Listok Integration — Nginx Default Server Config
# ============================================================

# Default server block — redirect all HTTP to HTTPS
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt challenge (if SSL is used)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

