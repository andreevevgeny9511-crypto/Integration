<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Nokia 3310</title>
<style>
  :root{
    --lcd-bg: #9bad87;      /* фон ЖК-экрана */
    --lcd-dark: #2e3a26;    /* пиксели */
    --bezel: #1a1d24;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 30%, #3b414d, #14161c 70%);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
  }
  .phone{
    background: linear-gradient(160deg,#4b5563,#2f3640 60%,#23282f);
    border-radius: 48px 48px 90px 90px;
    padding: 26px 24px 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.4);
    width: 380px;
  }
  .brand{
    text-align:center;color:#cfd6dd;font-weight:700;letter-spacing:4px;
    font-size:18px;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .screen-frame{
    background: var(--bezel);
    border-radius: 14px;
    padding: 14px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.8);
  }
  canvas{
    display:block;
    width:100%;
    image-rendering: pixelated;
    background: var(--lcd-bg);
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.15);
  }
  .keys{
    margin-top:22px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
    justify-items:center;
  }
  .key{
    background: linear-gradient(180deg,#e8ebef,#b9c0c9);
    border:none;
    color:#2b3038;
    font-size:20px;font-weight:700;
    border-radius: 50%;
    width:64px;height:64px;
    cursor:pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.8);
    user-select:none;
    transition: transform .05s;
  }
  .key:active{transform:translateY(2px);box-shadow:0 2px 3px rgba(0,0,0,.4);}
  .key.small{width:52px;height:52px;font-size:14px;border-radius:12px;}
  .hint{
    text-align:center;color:#9aa4af;font-size:12px;margin-top:16px;line-height:1.5;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="brand">NOKIA</div>
  <div class="screen-frame">
    <canvas id="lcd" width="336" height="288"></canvas>
  </div>
  <div class="keys">
    <button class="key small" data-dir="up" style="grid-column:2">▲</button>
    <button class="key small" data-dir="left" style="grid-row:2;grid-column:1">◀</button>
    <button class="key small" data-dir="down" style="grid-row:2;grid-column:2">▼</button>
    <button class="key small" data-dir="right" style="grid-row:2;grid-column:3">▶</button>
    <button class="key" id="btnOk" style="grid-column:2;">OK</button>
  </div>
  <div class="hint">
    Стрелки / WASD — движение · Пробел или OK — старт/пауза<br>
    На телефоне — кнопки на экране
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('lcd');
  const ctx = canvas.getContext('2d');

  // ---- "Пиксельная" сетка как у Nokia (LCD cells) ----
  const CELL = 8;               // размер пиксель-ячейки с зазором
  const GAP = 2;                // зазор между пикселями (эффект LCD)
  const COLS = Math.floor(canvas.width / CELL);   // 42
  const ROWS = Math.floor(canvas.height / CELL);  // 36

  const DARK  = '#2e3a26';
  const GHOST = 'rgba(46,58,38,0.09)'; // едва заметные "выключенные" пиксели

  // ---- Состояние игры ----
  let snake, dir, nextDir, food, score, best, speed, timer, state;
  // state: 'menu' | 'play' | 'pause' | 'over'
  best = Number(localStorage.getItem('snakeNokiaBest') || 0);

  function reset(){
    const cy = Math.floor(ROWS/2), cx = Math.floor(COLS/2);
    snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    dir = {x:1,y:0};
    nextDir = dir;
    score = 0;
    speed = 140; // мс на шаг
    placeFood();
  }

  function placeFood(){
    while(true){
      const f = {x: Math.floor(Math.random()*COLS), y: 4 + Math.floor(Math.random()*(ROWS-4))};
      if(!snake.some(s => s.x===f.x && s.y===f.y)){ food = f; return; }
    }
  }

  // ---- Отрисовка "жидкокристаллических" пикселей ----
  function px(x, y, color=DARK){
    ctx.fillStyle = color;
    ctx.fillRect(x*CELL+GAP/2, y*CELL+GAP/2, CELL-GAP, CELL-GAP);
  }

  function drawGhostGrid(){
    for(let x=0;x<COLS;x++)
      for(let y=0;y<ROWS;y++)
        px(x,y,GHOST);
  }

  // Текст в стиле LCD-символов
  function drawText(text, cx, cy, size=20, color=DARK){
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy);
  }

  function drawBorder(){
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, canvas.width-4, canvas.height-4);
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGhostGrid();
    drawBorder();

    if(state==='menu'){
      drawText('SNAKE II', canvas.width/2, 70, 34);
      drawText('Nokia 3310', canvas.width/2, 110, 18);
      drawText('Нажмите OK / Пробел', canvas.width/2, 200, 16);
      if(best) drawText('Рекорд: '+best, canvas.width/2, 240, 16);
      return;
    }

    // счёт сверху
    drawText(String(score).padStart(4,'0'), canvas.width/2, 22, 20);

    // еда — "муха" из пикселей (крестик + рамка)
    const f = food;
    px(f.x, f.y);
    px(f.x-1,f.y); px(f.x+1,f.y); px(f.x,f.y-1); px(f.x,f.y+1);

    // змея — сегменты из LCD-пикселей, соединённые между собой
    snake.forEach((s,i)=>{
      px(s.x,s.y);
      const prev = snake[i-1]; // голова ближе к началу массива
      if(prev){
        // "перемычка" между соседними сегментами, чтобы тело было сплошным
        const dx = Math.sign(prev.x - s.x), dy = Math.sign(prev.y - s.y);
        px(s.x+dx, s.y+dy);
        if(dx && dy===0){ px(s.x+dx, s.y-1); px(s.x+dx, s.y+1); }
        if(dy && dx===0){ px(s.x-1, s.y+dy); px(s.x+1, s.y+dy); }
      }
    });

    if(state==='pause'){
      ctx.fillStyle='rgba(155,173,135,0.85)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawGhostGrid();
      drawText('ПАУЗА', canvas.width/2, canvas.height/2, 30);
    }
    if(state==='over'){
      ctx.fillStyle='rgba(155,173,135,0.85)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      drawGhostGrid();
      drawText('GAME OVER', canvas.width/2, 100, 28);
      drawText('Счёт: '+score, canvas.width/2, 150, 20);
      drawText('Рекорд: '+best, canvas.width/2, 180, 16);
      drawText('OK — заново', canvas.width/2, 230, 16);
    }
  }

  // ---- Логика шага ----
  function step(){
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // столкновение со стеной или собой
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS ||
       snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver();
      return;
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
      score += 10;
      speed = Math.max(60, speed - 3); // ускоряемся
      clearInterval(timer);
      timer = setInterval(step, speed);
      placeFood();
      beep(880, 0.05);
    } else {
      snake.pop();
    }
    render();
  }

  function gameOver(){
    clearInterval(timer);
    state='over';
    if(score>best){ best=score; localStorage.setItem('snakeNokiaBest', best); }
    render();
    beep(220,0.15); setTimeout(()=>beep(160,0.25),120);
  }

  // ---- Звук в стилеold-school (Web Audio) ----
  let actx;
  function beep(freq, dur){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='square'; o.frequency.value=freq;
      g.gain.value=0.04;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  // ---- Управление ----
  function setDir(dx,dy){
    if(state!=='play') return;
    if(dx===-dir.x && dy===-dir.y) return; // разворот запрещён
    nextDir={x:dx,y:dy};
  }

  function startOrPause(){
    if(state==='menu'||state==='over'){
      reset(); state='play';
      clearInterval(timer); timer=setInterval(step,speed);
    } else if(state==='play'){ state='pause'; clearInterval(timer); }
    else if(state==='pause'){ state='play'; timer=setInterval(step,speed); }
    render();
  }

  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','w','ц'].includes(k))    setDir(0,-1);
    if(['arrowdown','s','ы'].includes(k))  setDir(0,1);
    if(['arrowleft','a','ф'].includes(k))  setDir(-1,0);
    if(['arrowright','d','в'].includes(k)) setDir(1,0);
    if(k===' '||k==='enter'){ e.preventDefault(); startOrPause(); }
  });

  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d=b.dataset.dir;
      if(d==='up')setDir(0,-1); if(d==='down')setDir(0,1);
      if(d==='left')setDir(-1,0); if(d==='right')setDir(1,0);
    });
  });
  document.getElementById('btnOk').addEventListener('click', startOrPause);

  // ---- Старт ----
  reset();
  state='menu';
  render();
})();
</script>
</body>
</html>
