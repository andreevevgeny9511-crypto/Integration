version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bitrix-listok-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL}
      - LISTOK_API_KEY=${LISTOK_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-60}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - integration-net

  db:
    image: postgres:16-alpine
    container_name: bitrix-listok-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitrix_listok}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d/migrations
      - ./data/seeds:/docker-entrypoint-initdb.d/seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - integration-net

  nginx:
    image: nginx:alpine
    container_name: bitrix-listok-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - integration-net

volumes:
  pgdata:
    driver: local

networks:
  integration-net:
    driver: bridge
