# ============================================================
# Bitrix24 ↔ Listok Integration — Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics (Node.js / Prometheus client)
  - job_name: 'bitrix-listok-app'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'bitrix-listok'
          environment: 'production'

  # Nginx metrics
  - job_name: 'bitrix-listok-nginx'
    static_configs:
      - targets: ['nginx:8080']
        labels:
          app: 'bitrix-listok'
          environment: 'production'

  # PostgreSQL metrics (requires postgres_exporter sidecar)
  - job_name: 'bitrix-listok-postgres'
    static_configs:
      - targets: ['db:9187']
        labels:
          app: 'bitrix-listok'
          environment: 'production'

  # Docker container metrics (cAdvisor)
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          app: 'bitrix-listok'
          environment: 'production'

  # Node exporter for host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'bitrix-listok'
          environment: 'production'
